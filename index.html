            saveEditedGrade: (e) => {
                e.preventDefault();
                if(state.editingGrade === null) return;
                
                const newGradeName = document.getElementById('edit-grade-input').value.trim();
                const oldGradeName = state.editingGrade.oldValue;
                
                if(!newGradeName || newGradeName === oldGradeName) {
                    window.app.closeEditGradeModal();
                    return;
                }
                
                // Validar que no exista otro grado con ese nombre
                if(state.adminData.grades.includes(newGradeName)) {
                    alert("Ya existe un grado con ese nombre.");
                    return;
                }
                
                const fullData = getFullLocalData();
                const idx = state.adminData.grades.indexOf(oldGradeName);
                
                if(idx > -1) {
                    state.adminData.grades[idx] = newGradeName;
                    state.adminData.students[newGradeName] = state.adminData.students[oldGradeName] || [];
                    delete state.adminData.students[oldGradeName];
                    if (state.adminSelectedGrade === oldGradeName) state.adminSelectedGrade = newGradeName;
                    
                    fullData.adminData = state.adminData;
                    saveFullLocalData(fullData);
                    loadLocalData();
                    state.editingGrade = null;
                    renderView();
                    if (window.app && window.app.showToast) window.app.showToast('Grado actualizado exitosamente');
                }
            },

            addAdminItem: (e, type) => {
                e.preventDefault();
                const fullData = getFullLocalData() || { cycles: state.cycles || [], activeCycleId: state.activeCycleId, activeWeekId: state.activeWeekId, adminData: state.adminData || {} };
                let needsSave = false;

                if (type === 'grade') {
                    const input = document.getElementById('new-grade-input');
                    const val = input.value.trim();
                    if (val && !state.adminData.grades.includes(val)) {
                        state.adminData.grades.push(val);
                        if (!state.adminData.students[val]) state.adminData.students[val] = [];
                        needsSave = true;
                    }
                } 
                else if (type === 'student') {
                    const input = document.getElementById('new-student-input');
                    const rawVal = input ? input.value : '';
                    const lines = rawVal.split(/\r?\n/).map(i => i.trim()).filter(i => i !== '');
                    let parsedCount = 0;
                    let duplicateMessages = [];

                    if (!state.adminSelectedGrade) {
                        alert('Selecciona primero un grado antes de cargar alumnos.');
                    } else if (lines.length > 0) {
                        if (!state.adminData.students[state.adminSelectedGrade]) state.adminData.students[state.adminSelectedGrade] = [];
                        
                        lines.forEach(line => {
                            const normalizedLine = line.replace(/\s+/g, ' ').trim();
                            const curpMatch = normalizedLine.match(/^([A-Z0-9]{18})\s+(.+)$/i);
                            let newStudent = null;

                            if (curpMatch) {
                                const curp = curpMatch[1].toUpperCase();
                                const rest = curpMatch[2].trim();
                                const nameMatch = rest.match(/^(.+?)\s*\/\s*(.+?)\s*\*\s*(.+)$/);
                                if (nameMatch) {
                                    const apPaterno = nameMatch[1].trim();
                                    const apMaterno = nameMatch[2].trim();
                                    const nombres = nameMatch[3].trim();
                                    const fullName = `${nombres} ${apPaterno} ${apMaterno}`.trim().replace(/\s+/g, ' ');

                                    newStudent = {
                                        id: 'stu_' + Date.now() + Math.random().toString(36).substr(2, 5),
                                        name: fullName,
                                        curp: curp,
                                        password: curp.substring(0, 10),
                                        isBlocked: false
                                    };
                                } else {
                                    newStudent = {
                                        id: 'stu_' + Date.now() + Math.random().toString(36).substr(2, 5),
                                        name: rest,
                                        curp: curp,
                                        password: curp.substring(0, 10),
                                        isBlocked: false
                                    };
                                }
                            } else {
                                newStudent = {
                                    id: 'stu_' + Date.now() + Math.random().toString(36).substr(2, 5),
                                    name: normalizedLine,
                                    curp: '',
                                    password: '',
                                    isBlocked: false
                                };
                            }

                            const existingGrade = findDuplicateStudentGrade(newStudent.name, newStudent.curp);
                            if (existingGrade) {
                                duplicateMessages.push(`${newStudent.name} no se pudo agregar porque ya aparece en ${existingGrade}.`);
                                return;
                            }
                            
                            state.adminData.students[state.adminSelectedGrade].push(newStudent);
                            needsSave = true;
                            parsedCount += 1;
                        });
                        if (parsedCount === 0 && duplicateMessages.length === 0) {
                            alert('No se encontraron líneas válidas para cargar. Revisa el formato CURP Apellido/Materno*Nombre.');
                        }
                    }

                    if (duplicateMessages.length > 0) {
                        alert(duplicateMessages.join('\n'));
                    }

                    if (needsSave) {
                        fullData.adminData = state.adminData;
                        saveFullLocalData(fullData);
                        loadLocalData();
                        state.activeModal = null;
                        renderView();

                        if (parsedCount > 0 && window.app && window.app.showToast) {
                            const message = parsedCount === 1 ? 'Se ha cargado 1 alumno.' : `Se han cargado ${parsedCount} alumnos.`;
                            window.app.showToast(message, 'success');
                        }
                    }
                }
                else if (type === 'alimento' || type === 'bebida') {
                    const inputId = type === 'alimento' ? 'new-alimento-input' : 'new-bebida-input';
                    const input = document.getElementById(inputId);
                    const rawVal = input.value;
                    const items = rawVal.split(/[,;\n]+/).map(i => i.trim()).filter(i => i !== '');

                    if (items.length > 0) {
                        items.forEach(item => {
                            if (type === 'alimento' && !state.adminData.alimentos.includes(item)) {
                                state.adminData.alimentos.push(item); needsSave = true;
                            } else if (type === 'bebida' && !state.adminData.bebidas.includes(item)) {
                                state.adminData.bebidas.push(item); needsSave = true;
                            }
                        });
                    }
                }

                if (needsSave) { fullData.adminData = state.adminData; saveFullLocalData(fullData); loadLocalData(); renderView(); }
            },

            addSingleStudent: (e) => {
                e.preventDefault();
                if(!state.adminSelectedGrade) {
                    alert('Selecciona primero un grado antes de agregar un alumno.');
                    return;
                }

                let nameVal = (document.getElementById('ind-nombre').value || '').trim();
                let curpVal = (document.getElementById('ind-curp').value || '').trim().toUpperCase();
                const individualPasswordInput = document.getElementById('ind-pwd');
                let pwdVal = getPasswordInputValue(individualPasswordInput).trim().toUpperCase().slice(0, 10);
                individualPasswordInput.dataset.rawPassword = pwdVal;
                renderMaskedPassword(individualPasswordInput);

                // Si el campo de nombre contiene CURP + resto, extraer CURP
                const combinedMatch = nameVal.match(/^([A-Z0-9]{18})\s+(.+)$/i);
                if (combinedMatch) {
                    curpVal = combinedMatch[1].toUpperCase();
                    nameVal = combinedMatch[2].trim();
                }

                // Si el nombre viene en formato APELLIDO/APE*MOMBRE, parsearlo
                const nameFmtMatch = nameVal.match(/^(.+?)\s*\/\s*(.+?)\s*\*\s*(.+)$/);
                if (nameFmtMatch) {
                    const apPaterno = nameFmtMatch[1].trim();
                    const apMaterno = nameFmtMatch[2].trim();
                    const nombres = nameFmtMatch[3].trim();
                    nameVal = `${nombres} ${apPaterno} ${apMaterno}`.replace(/\s+/g, ' ').trim();
                }

                // Si no hay contraseña pero sí CURP, autocompletar con primeros 10 caracteres
                if ((!pwdVal || pwdVal === '') && curpVal && curpVal.length >= 10) {
                    pwdVal = curpVal.substring(0, 10);
                    const pwdInput = document.getElementById('ind-pwd'); if (pwdInput) { pwdInput.dataset.rawPassword = pwdVal; renderMaskedPassword(pwdInput, true); }
                }

                if (!nameVal || !pwdVal) {
                    alert('Nombre y contraseña son obligatorios. Si no hay contraseña, ingresa CURP para autocompletar.');
                    return;
                }

                const newStudent = { id: 'stu_' + Date.now() + Math.random().toString(36).substr(2, 5), name: nameVal, curp: curpVal, password: pwdVal, isBlocked: false };
                const duplicateGrade = findDuplicateStudentGrade(newStudent.name, newStudent.curp);
                if (duplicateGrade) {
                    alert(`${newStudent.name} no se pudo agregar porque ya aparece en ${duplicateGrade}.`);
                    return;
                }

                const fullData = getFullLocalData() || { cycles: state.cycles || [], activeCycleId: state.activeCycleId, activeWeekId: state.activeWeekId, adminData: state.adminData || {} };
                if (!state.adminData.students[state.adminSelectedGrade]) state.adminData.students[state.adminSelectedGrade] = [];
                state.adminData.students[state.adminSelectedGrade].push(newStudent);
                
                fullData.adminData = state.adminData;
                saveFullLocalData(fullData); loadLocalData(); renderView();
            },

            prefillStudentPwd: (val) => {
                const curp = (val || '').trim().toUpperCase();
                const pwdInput = document.getElementById('ind-pwd');
                if (!pwdInput) return;
                if (curp.length >= 10) pwdInput.dataset.rawPassword = curp.substring(0, 10).toUpperCase();
                pwdInput.dataset.rawPassword = (pwdInput.dataset.rawPassword || '').slice(0, 10).toUpperCase();
                renderMaskedPassword(pwdInput);
            },

                const searchQuery = (isAlimentos ? state.adminAlimentoSearch : state.adminBebidaSearch || '').toLowerCase();

                    else state.adminSelectedBebidas = state.adminSelectedBebidas.filter(c => !filteredItems.includes(c));

                if (idx > -1) targetArray.splice(idx, 1);

            saveCatalogItemPresentation: (e) => {
                e.preventDefault();
                const item = state.modalData.item;
                const unit = document.getElementById('catalog-item-unit').value.trim();
                const includedQuantity = Number(document.getElementById('catalog-item-included').value);
                const additionalPrice = Number(document.getElementById('catalog-item-additional').value);
                const variants = document.getElementById('catalog-item-variants').value.split(',').map(value => value.trim()).filter(Boolean);
                if (!item || !unit || !Number.isInteger(includedQuantity) || includedQuantity < 1 || !Number.isFinite(additionalPrice) || additionalPrice < 0) {
                    window.app.showToast('Revisa los datos de la presentación.', 'error');

                }
                state.adminData.itemPricing[item] = { unit, includedQuantity, additionalPrice, variants };
                const fullData = getFullLocalData();

                saveFullLocalData(fullData);
                state.activeModal = null;
                state.modalData = {};
                loadLocalData();
                renderView();
                window.app.showToast(`Presentación de ${item} actualizada`, 'success');
            },

            deleteSelectedCatalog: (catalogType) => {
                const targetSelected = catalogType === 'alimentos' ? state.adminSelectedAlimentos : state.adminSelectedBebidas;
                if (!confirm(`¿Estás seguro de eliminar ${targetSelected.length} artículo(s) de todos los menús?`)) return;
                
                const fullData = getFullLocalData();
                targetSelected.forEach(item => {
                    if (catalogType === 'alimentos') state.adminData.alimentos = state.adminData.alimentos.filter(c => c !== item);
                    else state.adminData.bebidas = state.adminData.bebidas.filter(c => c !== item);
                    fullData.cycles.forEach(c => { c.weeks.forEach(w => { DIAS_SEMANA.forEach(d => { if (w.menu[d]) w.menu[d] = w.menu[d].filter(f => f !== item); }); }); });
                });
                
                fullData.adminData = state.adminData; saveFullLocalData(fullData);
                if (catalogType === 'alimentos') state.adminSelectedAlimentos = [];
                else state.adminSelectedBebidas = [];
                loadLocalData(); renderView();
            },

            editAdminItem: (type, oldVal) => {
                if(type === 'student') return; 

                if (type === 'grade') {
                    // Abrir modal para editar grado
                    state.editingGrade = { oldValue: oldVal };
                    renderView();
                    return;
                }

                state.modalData = { type, item: oldVal };
                state.activeModal = 'edit-catalog-item';
                renderView();
            },

            saveCatalogItemName: (e) => {
                e.preventDefault();
                const type = state.modalData.type;
                const oldVal = state.modalData.item;
                const newVal = document.getElementById('catalog-item-name').value.trim();
                if (!newVal || newVal === oldVal) {
                    window.app.closeModal();
                    return;
                }
                
                const cleanVal = newVal.trim();
                const fullData = getFullLocalData();
                let needsSave = false;

                if (type === 'alimento' || type === 'bebida') {
                    const targetArray = type === 'alimento' ? state.adminData.alimentos : state.adminData.bebidas;
                    const idx = targetArray.indexOf(oldVal);
                    if (idx > -1) {
                        targetArray[idx] = cleanVal;
                        if (state.adminData.itemPricing[oldVal]) {
                            state.adminData.itemPricing[cleanVal] = state.adminData.itemPricing[oldVal];
                            delete state.adminData.itemPricing[oldVal];
                        }
                        fullData.cycles.forEach(c => { c.weeks.forEach(w => { DIAS_SEMANA.forEach(d => { if (w.menu[d]) { const mIdx = w.menu[d].indexOf(oldVal); if (mIdx > -1) w.menu[d][mIdx] = cleanVal; } }); }); });
                        if (type === 'alimento') { const cIdx = state.adminSelectedAlimentos.indexOf(oldVal); if (cIdx > -1) state.adminSelectedAlimentos[cIdx] = cleanVal; } 
                        else { const cIdx = state.adminSelectedBebidas.indexOf(oldVal); if (cIdx > -1) state.adminSelectedBebidas[cIdx] = cleanVal; }
                        needsSave = true;
                    }
                }

                let toastMessage = null;
                if (needsSave) { 
                    fullData.adminData = state.adminData; 
                    saveFullLocalData(fullData);
                    state.activeModal = null;
                    state.modalData = {};
                    loadLocalData();
                    if (typeof parsedCount !== 'undefined' && parsedCount > 0) {
                        toastMessage = parsedCount === 1 ? '1 alumno añadido' : parsedCount + ' alumnos añadidos';
                    } else if (type === 'alimento') {
                        toastMessage = 'Alimentos añadidos';
                    } else if (type === 'bebida') {
                        toastMessage = 'Bebidas añadidas';
                    }
                }
                if (toastMessage && window.app && window.app.showToast) window.app.showToast(toastMessage);
            },

            deleteAdminItem: (type, itemVal) => {
                if (!confirm(`¿Estás seguro de eliminar este elemento?`)) return;
                
                const fullData = getFullLocalData();
                let needsSave = false;

                if (type === 'grade') {
                    state.adminData.grades = state.adminData.grades.filter(g => g !== itemVal);
                    delete state.adminData.students[itemVal];
                    if (state.adminSelectedGrade === itemVal) state.adminSelectedGrade = '';
                    needsSave = true;
                } else if (type === 'student') {
                    if (state.adminSelectedGrade) {
                        state.adminData.students[state.adminSelectedGrade] = state.adminData.students[state.adminSelectedGrade].filter(s => s.id !== itemVal);
                        state.adminSelectedStudents = state.adminSelectedStudents.filter(id => id !== itemVal);
                        needsSave = true;
                    }
                } else if (type === 'alimento' || type === 'bebida') {
                    if (type === 'alimento') {
                        state.adminData.alimentos = state.adminData.alimentos.filter(c => c !== itemVal);
                        state.adminSelectedAlimentos = state.adminSelectedAlimentos.filter(c => c !== itemVal);
                    } else {
                        state.adminData.bebidas = state.adminData.bebidas.filter(c => c !== itemVal);
                        state.adminSelectedBebidas = state.adminSelectedBebidas.filter(c => c !== itemVal);
                    }
                    delete state.adminData.itemPricing[itemVal];
                    fullData.cycles.forEach(c => { c.weeks.forEach(w => { DIAS_SEMANA.forEach(d => { if (w.menu[d]) w.menu[d] = w.menu[d].filter(f => f !== itemVal); }); }); });
                    needsSave = true;
                }

                if (needsSave) { fullData.adminData = state.adminData; saveFullLocalData(fullData); loadLocalData(); renderView(); }
            },

            saveContactInfo: (e) => {
                e.preventDefault();
                state.adminData.contactInfo = { 
                    name: document.getElementById('contact-name').value.trim(), 
                    phone: document.getElementById('contact-phone').value.trim() 
                };
                const fullData = getFullLocalData(); fullData.adminData = state.adminData; saveFullLocalData(fullData);
                alert("¡Información de contacto guardada correctamente!");
            },

            savePasswords: (e) => {
                e.preventDefault();
                state.adminData.passwords = { admin: getPasswordInputValue(document.getElementById('pwd-admin')).trim(), cocina: getPasswordInputValue(document.getElementById('pwd-cocina')).trim(), escuela: getPasswordInputValue(document.getElementById('pwd-escuela')).trim() };
                const fullData = getFullLocalData(); fullData.adminData = state.adminData; saveFullLocalData(fullData);
                alert("¡Contraseñas actualizadas correctamente!");
            },

            saveCatalogPricing: (e) => {
                e.preventDefault();
                const defaultFood = Number(document.getElementById('default-food-price').value);
                const defaultDrink = Number(document.getElementById('default-drink-price').value);
                if (!Number.isFinite(defaultFood) || defaultFood < 0 || !Number.isFinite(defaultDrink) || defaultDrink < 0) {
                    window.app.showToast('Los precios deben ser números mayores o iguales a cero.', 'error');
                    return;
                }
                state.adminData.pricing.defaultFood = defaultFood;
                state.adminData.pricing.defaultDrink = defaultDrink;
                const fullData = getFullLocalData();
                fullData.adminData = state.adminData;
                saveFullLocalData(fullData);
                loadLocalData();
                window.app.showToast('Precios generales actualizados correctamente', 'success');
            },

            resetFirebaseData: async () => {
                await initializeEmptyDB();
                alert("¡Datos reiniciados correctamente!");
            }
        };

        // Arrancamos Firebase
        initFirebase();

        // Cerrar dropdown de alumnos al hacer clic fuera
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('student-dropdown');
            if (!dropdown || dropdown.classList.contains('hidden')) return;
            const search = document.getElementById('form-student-search');
            const toggleBtn = document.querySelector('button[onclick="window.app.toggleStudentDropdown()"]');
            const target = e.target;
            if (search && (search === target || search.contains(target))) return;
            if (toggleBtn && (toggleBtn === target || toggleBtn.contains(target))) return;
            if (dropdown.contains(target)) return;
            dropdown.classList.add('hidden');
        });

    </script>
</body>
</html>
