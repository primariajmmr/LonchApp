<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LonchApp</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1tovbiGsHYnyd6urb9wYv_Sg45TYBtATd">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast.out { animation: slideOut 0.3s ease-out forwards; }
        @keyframes slideOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-blue-100 min-h-screen">

    <!-- Loading Screen -->
    <div id="loading-screen" class="min-h-screen flex items-center justify-center p-4 z-50 fixed inset-0 bg-slate-50">
        <div class="animate-pulse flex flex-col items-center" id="loading-content">
            <div class="w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin mb-4"></div>
            <p class="text-slate-500 font-medium text-lg">Conectando a la base de datos en la nube...</p>
        </div>
    </div>

    <!-- Main Application UI -->
    <div id="app-container" class="hidden relative">
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button id="btn-back" onclick="window.app.setView('home')" class="hidden p-2 -ml-2 hover:bg-slate-100 rounded-full transition-colors text-slate-600">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    </button>
                    <div class="flex items-center gap-2">
                                <img src="https://lh3.googleusercontent.com/d/14MLjP5S2pcYTla3sR14wfydSPdbLuxoP" alt="LonchApp" class="h-10 w-auto object-contain">
                            </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
            <!-- Views will be injected here via JavaScript -->
        </main>
        
        <!-- Modal Container -->
        <div id="modal-container"></div>
        
        <!-- Toast Notifications Container -->
        <div id="toast-container" class="fixed top-4 right-4 z-[60] space-y-2 max-w-sm"></div>
    </div>

    <!-- Logic Script (Type Module for Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de Firebase del usuario
        const firebaseConfig = {
            apiKey: "AIzaSyDbmTr8iOj03H4ieNKXASLpQNAKiAEcupM",
            authDomain: "tienda-escolar-jmmr.firebaseapp.com",
            projectId: "tienda-escolar-jmmr",
            storageBucket: "tienda-escolar-jmmr.firebasestorage.app",
            messagingSenderId: "771853362864",
            appId: "1:771853362864:web:58d1fbb7c67bce71dabd75"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Path estructurado para guardar toda la aplicación
        const docRef = doc(db, 'artifacts', 'tienda-escolar-jmmr', 'public', 'data', 'tienda_data', 'main');

        // --- CONSTANTES ---
        const ALIMENTOS_BASE = [];
        const BEBIDAS_BASE = [];
        const DIAS_SEMANA = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
        const GRADOS = ['1A', '1B', '2A', '2B', '3A', '3B', '4A', '5A', '6A'];
        
const DEFAULT_ORDER_PRICE = 35;
        const MENU_POR_DEFECTO = {
            Lunes: [],
            Martes: [],
            Miércoles: [],
            Jueves: [],
            Viernes: []
        };

        // --- ESTADO GLOBAL ---
        const state = {
            view: 'home', 
            schoolTab: 'pedidos', 
            menuConfigDay: 'Lunes',
            kitchenDay: 'Lunes', 
            kitchenTab: 'pendientes',
            kitchenGradeFilter: 'Todos', 
            kitchenOrderSearch: '',
            kitchenSelectedDelivered: [], 
            
            cycles: [],
            activeCycleId: null, 
            managingCycleId: null,
            managingWeekId: null, 
            reportCycleId: null,
            reportWeekId: null, 
            
            draftMenu: null,
            draftMenuPrices: {},
            draftInactiveDays: [], 
            adminData: {
                grades: [], students: {}, alimentos: [], bebidas: [],   
                itemPricing: {},
                passwords: {}, contactInfo: { name: '', phone: '' },
                settings: { homeOrderSchedule: { mode: 'always', days: [1,2,3,4,5], start: '07:00', end: '16:00' } },
                menuTemplates: [],
                pricing: { defaultOrder: DEFAULT_ORDER_PRICE, defaultFood: 0, defaultDrink: 0 }
            },
            menuConfigSearch: '',
            reportPeriod: 'semanal',
            reportDay: 'Lunes',
            
            adminSelectedGrade: '',
            adminStudentAddMode: 'masivo', 
            editingStudent: null,
            editingGrade: null,
            loggedStudent: null,  
            
            formSelection: { day: null, grade: '', payment: 'Pagado' },
            
            adminSelectedStudents: [],
            adminSelectedAlimentos: [],
            adminSelectedBebidas: [],
            adminStudentSearch: '',
            adminStudentSuggestionOpen: false,
            adminAlimentoSearch: '',
            adminBebidaSearch: '',
            adminAlimentosCollapsed: false,
            adminBebidasCollapsed: false,
            
            schoolOrderSearch: '', // Búsqueda en pedidos de escuela
            
            adminOrderDay: 'Lunes',
            adminOrderGrade: 'Todos',
            
            adminTab: 'config', // Nueva propiedad para controlar tabs del admin
            menuConfigTab: 'alimentos', // Tab para Alimentos/Bebidas en Config. Menú
            
            activeModal: null,
            modalData: {},
            pendingOrderConfirmation: null,

            dbConnected: false // Estado de conexión de Firebase
        };

        let cloudData = null; // Mantiene la última copia de la base de datos
        let menuSaveObserver = null;

        // --- HELPERS ---
        const getActiveCycle = () => state.cycles.find(c => c.id === state.activeCycleId) || state.cycles[0];
        const getManagingCycle = () => state.cycles.find(c => c.id === state.managingCycleId) || getActiveCycle();
        const getActiveWeek = () => { const c = getActiveCycle(); return c ? (c.weeks.find(w => w.id === c.activeWeekId) || c.weeks[0]) : null; };
        const getManagingWeek = () => { const c = getManagingCycle(); return c ? (c.weeks.find(w => w.id === state.managingWeekId) || c.weeks[0]) : null; };

        // --- FIREBASE DATA LAYER ---
        function getFullLocalData() {
            // Retorna una copia profunda del último estado de la nube
            return cloudData ? JSON.parse(JSON.stringify(cloudData)) : null;
        }

        async function saveFullLocalData(data) {
            cloudData = JSON.parse(JSON.stringify(data)); // Optimistic UI Update
            try {
                await setDoc(docRef, data);
            } catch (e) {
                console.error("Error al guardar en Firebase:", e);
                alert("Error de permisos guardando en la nube. Revisa la consola.");
            }
        }

        function hydrateState(data) {
            data.cycles?.forEach(cycle => cycle.weeks?.forEach(week => {
                const orders = week.orders || [];
                const highestNumber = orders.reduce((highest, order) => {
                    const number = Number(order.orderNumber);
                    return Number.isFinite(number) ? Math.max(highest, number) : highest;
                }, 0);
                let nextNumber = highestNumber + 1;
                orders.forEach(order => {
                    if (!Number.isFinite(Number(order.orderNumber))) order.orderNumber = nextNumber++;
                });
            }));
            state.cycles = data.cycles || [];
            state.activeCycleId = data.activeCycleId;
            state.adminData = data.adminData;
            
            const currentActiveCycle = state.cycles.find(c => c.id === state.activeCycleId) || state.cycles[0];
            state.activeWeekId = currentActiveCycle ? currentActiveCycle.activeWeekId : null;
            
            if (!state.adminData.alimentos) state.adminData.alimentos = [];
            if (!state.adminData.bebidas) state.adminData.bebidas = [];
            if (!state.adminData.itemPricing) state.adminData.itemPricing = {};
            if (!state.adminData.passwords) state.adminData.passwords = { admin: 'admin', cocina: '', escuela: '' };
            if (!state.adminData.contactInfo) state.adminData.contactInfo = { name: '', phone: '' };
            if (!state.adminData.settings) state.adminData.settings = { homeOrderSchedule: { mode: 'always', days: [1,2,3,4,5], start: '07:00', end: '16:00' } };
            if (!state.adminData.menuTemplates) state.adminData.menuTemplates = [];
            if (!state.adminData.pricing) state.adminData.pricing = { defaultOrder: DEFAULT_ORDER_PRICE, defaultFood: 0, defaultDrink: 0 };
            if (typeof state.adminData.pricing.defaultFood !== 'number') state.adminData.pricing.defaultFood = 0;
            if (typeof state.adminData.pricing.defaultDrink !== 'number') state.adminData.pricing.defaultDrink = 0;

            if (!state.activeCycleId || !state.cycles.find(c => c.id === state.activeCycleId)) {
                state.activeCycleId = state.cycles.length > 0 ? state.cycles[0].id : null;
            }
            if (!state.managingCycleId || !state.cycles.find(c => c.id === state.managingCycleId)) {
                state.managingCycleId = state.activeCycleId;
            }
            if (!state.reportCycleId || !state.cycles.find(c => c.id === state.reportCycleId)) {
                state.reportCycleId = state.activeCycleId;
            }
            
            const managingCycle = getManagingCycle();
            if (managingCycle && (!state.managingWeekId || !managingCycle.weeks.find(w => w.id === state.managingWeekId))) {
                state.managingWeekId = managingCycle.activeWeekId || (managingCycle.weeks.length > 0 ? managingCycle.weeks[0].id : null);
            }
            
            const reportCycle = state.cycles.find(c => c.id === state.reportCycleId) || getActiveCycle();
            if (reportCycle && (!state.reportWeekId || !reportCycle.weeks.find(w => w.id === state.reportWeekId))) {
                state.reportWeekId = reportCycle.activeWeekId || (reportCycle.weeks.length > 0 ? reportCycle.weeks[0].id : null);
            }

            const managingWeek = getManagingWeek();
            if (managingWeek) {
                state.draftMenu = JSON.parse(JSON.stringify(managingWeek.menu || MENU_POR_DEFECTO));
                state.draftMenuPrices = JSON.parse(JSON.stringify(managingWeek.menuPrices || {}));
                state.draftInactiveDays = [...(managingWeek.inactiveDays || [])]; 
            } else {
                state.draftMenu = JSON.parse(JSON.stringify(MENU_POR_DEFECTO));
                state.draftMenuPrices = {};
                state.draftInactiveDays = [];
            }

            // Ocultar pantalla de carga
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            renderView();
        }

        function loadLocalData() {
            if (cloudData) {
                hydrateState(cloudData);
            }
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(amount);
        }

        function getCatalogDefaultPrice(item) {
            if (state.adminData.bebidas.includes(item)) return Number(state.adminData.pricing?.defaultDrink) || 0;
            return Number(state.adminData.pricing?.defaultFood) || 0;
        }

        function getItemPricing(item, menuPrices = state.draftMenuPrices) {
            const configured = state.adminData.itemPricing?.[item] || {};
            const menuPrice = Number(menuPrices?.[item]);
            const price = Number.isFinite(menuPrice) && menuPrice >= 0 ? menuPrice : (Number(configured.price) || getCatalogDefaultPrice(item));
            const includedQuantity = Math.max(1, Number(configured.includedQuantity) || 1);
            const additionalPrice = Number.isFinite(Number(configured.additionalPrice)) && Number(configured.additionalPrice) >= 0
                ? Number(configured.additionalPrice)
                : price / includedQuantity;
            return { price, unit: configured.unit || 'pieza', includedQuantity, additionalPrice, variants: Array.isArray(configured.variants) ? configured.variants : [] };
        }

        function getMenuItemPrice(item, menuPrices = state.draftMenuPrices) {
            return getItemPricing(item, menuPrices).price;
        }

        function getItemQuantityTotal(item, quantity, menuPrices) {
            const pricing = getItemPricing(item, menuPrices);
            const fullPackages = Math.floor(quantity / pricing.includedQuantity);
            const remainder = quantity % pricing.includedQuantity;
            return (fullPackages * pricing.price) + (remainder * pricing.additionalPrice);
        }

        function getOrderLinesTotal(lines, menuPrices) {
            const quantitiesByItem = lines.reduce((totals, line) => {
                totals[line.item] = (totals[line.item] || 0) + (Number(line.quantity) || 0);
                return totals;
            }, {});
            return Object.entries(quantitiesByItem).reduce((total, [item, quantity]) => {
                return total + getItemQuantityTotal(item, quantity, menuPrices);
            }, 0);
        }

        function getOrderTotal(order, week) {
            if (typeof order?.price === 'number') return order.price;
            const items = (order.items || []).length
                ? order.items
                : (order.breakfastType || '').split(' + ').map(item => ({ item: item.trim(), quantity: 1 })).filter(entry => entry.item);
            return getOrderLinesTotal(items, week?.menuPrices);
        }

        function formatOrderNumber(number) {
            return String(number || '').padStart(3, '0');
        }

        function getOrderNumber(order, fallbackIndex = 0) {
            return formatOrderNumber(order?.orderNumber || fallbackIndex + 1);
        }

        function getNextOrderNumber(week) {
            const highestNumber = (week?.orders || []).reduce((highest, order) => {
                const number = Number(order.orderNumber);
                return Number.isFinite(number) ? Math.max(highest, number) : highest;
            }, 0);
            return highestNumber + 1;
        }

        function getSelectedOrderLines(targetWeek) {
            return Array.from(document.querySelectorAll('input[name="foodSelection"]:checked, input[name="drinkSelection"]:checked')).flatMap(input => {
                const pricing = getItemPricing(input.value, targetWeek?.menuPrices);
                if (pricing.variants.length > 0) {
                    return Array.from(input.closest('label')?.querySelectorAll('.order-variant-quantity') || [])
                        .map(quantityInput => ({ item: input.value, variant: quantityInput.dataset.variant, quantity: Number(quantityInput.value) || 0 }))
                        .filter(line => line.quantity > 0);
                }
                const quantityInput = input.closest('label')?.querySelector('.order-item-quantity');
                return [{ item: input.value, variant: '', quantity: Math.max(1, Number(quantityInput?.value) || 1) }];
            });
        }

        function updateSelectedOrderTotal(source) {
            const totalContainer = document.getElementById('selected-order-total');
            if (!totalContainer) return;
            const targetWeek = source === 'Escuela' ? getManagingWeek() : getActiveWeek();
            const selectedLines = getSelectedOrderLines(targetWeek);
            const total = getOrderLinesTotal(selectedLines, targetWeek?.menuPrices);
            if (!selectedLines.length) {
                totalContainer.classList.add('hidden');
                return;
            }
            totalContainer.innerHTML = `<span>Total a pagar</span><strong>${formatCurrency(total)}</strong>`;
            totalContainer.classList.remove('hidden');
        }

        function refreshSelectedOrderTotal(source) {
            requestAnimationFrame(() => updateSelectedOrderTotal(source));
            setTimeout(() => updateSelectedOrderTotal(source), 0);
        }

        function updateMenuConfigSearchUI() {
            const query = (state.menuConfigSearch || '').trim().toLowerCase();
            document.querySelectorAll('[data-menu-search-item]').forEach(item => {
                item.classList.toggle('hidden', query && !item.dataset.menuSearchItem.includes(query));
            });
        }

        function getReportOrders(cycle, week, period, day) {
            if (!cycle) return [];
            if (period === 'mensual') {
                return cycle.weeks.flatMap(w => w.orders || []);
            }
            if (period === 'semanal') {
                return week ? (week.orders || []) : [];
            }
            if (period === 'diario') {
                return week ? (week.orders || []).filter(o => o.dayFor === day) : [];
            }
            return [];
        }

        function computeFoodStats(orders) {
            return orders.reduce((acc, o) => {
                const items = (o.items || []).length
                    ? o.items
                    : o.breakfastType.split(' + ').map(item => ({ item: item.trim(), quantity: 1 })).filter(entry => entry.item);
                items.forEach(entry => { acc[entry.item] = (acc[entry.item] || 0) + (entry.quantity || 1); });
                return acc;
            }, {});
        }

        function exportReportCsv(reportData) {
            const rows = [];
            rows.push(['Alumno', 'Grado', 'Día', 'Pedido', 'Estatus', 'Pago', 'Fecha']);
            reportData.forEach(o => {
                rows.push([o.studentName, o.grade, o.dayFor, o.breakfastType, o.status, o.paymentStatus, new Date(o.createdAt).toLocaleDateString()]);
            });
            const csvContent = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'reporte_lonchapp.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function exportReportPdf(reportData) {
            const win = window.open('', '_blank');
            if (!win) return;
            const html = `
                <html>
                <head>
                    <title>Reporte LonchApp</title>
                    <style>
                        body { font-family: sans-serif; padding: 24px; color: #0f172a; }
                        h1 { font-size: 24px; margin-bottom: 12px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
                        th, td { padding: 10px; border: 1px solid #cbd5e1; text-align: left; }
                        th { background: #f8fafc; }
                    </style>
                </head>
                <body>
                    <h1>Reporte LonchApp</h1>
                    <table>
                        <thead><tr><th>Alumno</th><th>Grado</th><th>Día</th><th>Pedido</th><th>Estatus</th><th>Pago</th><th>Fecha</th></tr></thead>
                        <tbody>
                        ${reportData.map(o => `
                            <tr>
                                <td>${o.studentName}</td>
                                <td>${o.grade}</td>
                                <td>${o.dayFor}</td>
                                <td>${o.breakfastType}</td>
                                <td>${o.status}</td>
                                <td>${o.paymentStatus}</td>
                                <td>${new Date(o.createdAt).toLocaleDateString()}</td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </body>
                </html>
            `;
            win.document.write(html);
            win.document.close();
            win.focus();
        }

        async function initializeEmptyDB() {
            const newWeek = { id: 'week_' + Date.now(), range: 'Primera Semana', menu: MENU_POR_DEFECTO, orders: [], inactiveDays: [], status: 'active' };
            const newCycle = { id: 'cycle_' + Date.now(), name: 'Ciclo 2025-2026', weeks: [newWeek], activeWeekId: newWeek.id };
            
            const newData = {
                cycles: [newCycle],
                activeCycleId: newCycle.id,
                adminData: {
                    grades: [...GRADOS],
                    students: {},
                    alimentos: [],
                    bebidas: [],
                    itemPricing: {},
                    passwords: { admin: 'admin', cocina: '', escuela: '' },
                    contactInfo: { name: '', phone: '' },
                    settings: { homeOrderSchedule: { mode: 'always', days: [1,2,3,4,5], start: '07:00', end: '16:00' } },
                    menuTemplates: [],
                    pricing: { defaultOrder: DEFAULT_ORDER_PRICE, defaultFood: 0, defaultDrink: 0 }
                }
            };
            
            for(let g of GRADOS) {
                newData.adminData.students[g] = [];
            }

            await saveFullLocalData(newData);
        }

        // --- INICIALIZACIÓN DE FIREBASE ---
        async function initFirebase() {
            const defaultDayIndex = new Date().getDay() - 1;
            const currentDayString = DIAS_SEMANA[defaultDayIndex >= 0 && defaultDayIndex < 5 ? defaultDayIndex : 0];
            state.formSelection.day = currentDayString;
            state.kitchenDay = currentDayString; 

            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        onSnapshot(docRef, (docSnap) => {
                            state.dbConnected = true;
                            if (docSnap.exists()) {
                                cloudData = docSnap.data();
                                hydrateState(cloudData);
                            } else {
                                initializeEmptyDB();
                            }
                        }, (error) => {
                            state.dbConnected = false;
                            console.error("Error al escuchar Firebase:", error);
                            document.getElementById('loading-content').innerHTML = `
                                <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md text-center border border-red-100 fade-in">
                                    <div class="bg-red-100 text-red-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    </div>
                                    <h2 class="text-xl font-bold text-slate-900 mb-2">Error de Permisos (Firestore)</h2>
                                    <p class="text-slate-600 text-sm mb-4">No se pudo acceder a la base de datos. Las reglas de seguridad de Firestore están bloqueando el acceso.</p>
                                    <div class="text-left bg-slate-50 p-4 rounded-xl text-sm text-slate-700">
                                        <p class="font-bold mb-1 text-slate-800">Para solucionarlo:</p>
                                        <ol class="list-decimal pl-5 space-y-2 text-slate-600">
                                            <li>Ve a tu consola de Firebase > <b>Firestore Database</b>.</li>
                                            <li>Entra a la pestaña <b>Reglas (Rules)</b>.</li>
                                            <li>Cambia el código a: <br><code class="bg-slate-200 px-2 py-1 rounded text-xs mt-1 block font-mono">match /{document=**} {<br>&nbsp;&nbsp;allow read, write: if true;<br>}</code></li>
                                            <li>Haz clic en <b>Publicar</b> y recarga esta página.</li>
                                        </ol>
                                    </div>
                                </div>
                            `;
                        });
                    }
                });
            } catch (e) {
                console.error("Error Auth:", e);
                document.getElementById('loading-content').innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md text-center border border-red-100 fade-in">
                        <div class="bg-red-100 text-red-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>

        function getPasswordInputValue(input) {
            return input?.dataset.rawPassword ?? input?.value ?? '';
        }

        function renderMaskedPassword(input, revealLast = false) {
            const raw = input.dataset.rawPassword || '';
            const masked = raw.replace(/./g, '•');
            input.value = revealLast && raw ? `${masked.slice(0, -1)}${raw.slice(-1)}` : masked;
        }

        function initializePasswordInputs() {
            document.querySelectorAll('[data-password-reveal]').forEach(input => {
                if (input.dataset.passwordInitialized === 'true') return;
                input.dataset.rawPassword = input.value || '';
                input.dataset.passwordInitialized = 'true';
                renderMaskedPassword(input);
            });
        }

        function initializeMenuSaveObserver() {
            if (menuSaveObserver) menuSaveObserver.disconnect();
            const floatingSaveButton = document.getElementById('floating-menu-save');
            const bottomSaveButton = document.getElementById('bottom-menu-save');
            if (!floatingSaveButton || !bottomSaveButton) return;

            menuSaveObserver = new IntersectionObserver(([entry]) => {
                floatingSaveButton.classList.toggle('opacity-0', entry.isIntersecting);
                floatingSaveButton.classList.toggle('pointer-events-none', entry.isIntersecting);
                floatingSaveButton.setAttribute('aria-hidden', entry.isIntersecting ? 'true' : 'false');
            }, { threshold: 0.15 });
            menuSaveObserver.observe(bottomSaveButton);
        }

        function renderKitchenView() {
            const activeCycle = getActiveCycle();
            const activeWeek = getActiveWeek();
            if (!activeCycle || !activeWeek) return `<div class="p-8 text-center text-red-500 font-bold">Error: No hay un Ciclo o Semana activa configurada.</div>`;

            const filteredByDay = activeWeek.orders.filter(o => o.dayFor === state.kitchenDay);
            const filteredByGrade = state.kitchenGradeFilter === 'Todos' ? filteredByDay : filteredByDay.filter(o => o.grade === state.kitchenGradeFilter);
            const orderSearch = (state.kitchenOrderSearch || '').trim().toLowerCase();
            const filteredBySearch = orderSearch
                ? filteredByGrade.filter((order, index) => getOrderNumber(order, index).includes(orderSearch) || order.studentName.toLowerCase().includes(orderSearch))
                : filteredByGrade;
            const pendOrders = filteredBySearch.filter(o => o.status === 'pendiente');
            const entOrders = filteredBySearch.filter(o => o.status === 'entregado');
            const displayedOrders = state.kitchenTab === 'pendientes' ? pendOrders : entOrders;

            let daysHtml = '';
            DIAS_SEMANA.forEach(d => {
                const isActive = d === state.kitchenDay;
                const btnClass = isActive ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200';
                daysHtml += `<button onclick="window.app.setKitchenDay('${d}')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors ${btnClass}">${d}</button>`;
            });

            let gradesFilterHtml = `<button onclick="window.app.setKitchenGradeFilter('Todos')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors ${state.kitchenGradeFilter === 'Todos' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200'}">Todos</button>`;

                gradesFilterHtml += `<button onclick="window.app.setKitchenGradeFilter('${g}')" class="px-4 py-2 rounded-lg text-sm font-bold transition-colors ${btnClass}">${g}</button>`;

            const summaryCounts = {};
            filteredByGrade.forEach(o => {
                const items = (o.items || []).length
                    ? o.items
                    : o.breakfastType.split(' + ').map(rawItem => {
                        const match = rawItem.trim().match(/^(.*?)(?:\s+x(\d+))?$/i);
                        return { item: match?.[1]?.trim() || rawItem.trim(), quantity: Number(match?.[2]) || 1 };
                    });
                items.forEach(entry => {
                    const summaryKey = entry.variant ? `${entry.item} - ${entry.variant}` : entry.item;

            const currentSelection = state.draftMenu[state.menuConfigDay] || [];
            const isInactive = state.draftInactiveDays.includes(state.menuConfigDay);

            const renderCategory = (items) => {
                if (items.length === 0) {
                    return `<div class="col-span-full bg-slate-50 text-slate-500 p-4 rounded-xl text-sm border border-slate-100">No hay resultados para la búsqueda.</div>`;
                }
                const orderedItems = [...items].sort((firstItem, secondItem) => {
                    const firstSelected = currentSelection.includes(firstItem) ? 0 : 1;
                    const secondSelected = currentSelection.includes(secondItem) ? 0 : 1;
                    if (firstSelected !== secondSelected) return firstSelected - secondSelected;
                    return firstItem.localeCompare(secondItem, 'es', { sensitivity: 'base' });
                });
                return orderedItems.map(item => {
                    const isSelected = currentSelection.includes(item);
                    const matchesSearch = !state.menuConfigSearch || item.toLowerCase().includes(state.menuConfigSearch.toLowerCase().trim());
                    const btnClass = isSelected ? 'border-emerald-500 bg-emerald-50 text-emerald-800' : 'border-slate-200 bg-white hover:border-slate-300 text-slate-600';
                    const circleClass = isSelected ? 'bg-emerald-500 text-white' : 'bg-slate-200';
                    const checkHtml = isSelected ? `<i data-lucide="check" class="w-3 h-3" stroke-width="4"></i>` : '';
                    const price = getMenuItemPrice(item);
                    return `
                        <div data-menu-search-item="${item.toLowerCase()}" class="${matchesSearch ? '' : 'hidden'} flex flex-col gap-3 w-full min-w-0 p-3 rounded-xl border transition-all text-sm ${btnClass}">

                                    $<input type="number" min="0" step="0.01" value="${price}" onchange="window.app.setMenuItemPrice('${item.replace(/'/g, "\\'")}', this.value)" class="w-20 bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-right text-sm text-slate-700 outline-none focus:border-emerald-500">
                                </label>
                                <button type="button" onclick="window.app.configureAdminItem('${state.adminData.bebidas.includes(item) ? 'bebida' : 'alimento'}', '${item.replace(/'/g, "\\'")}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200 text-xs font-semibold whitespace-nowrap transition-colors">Presentación</button>
                            </div>
                        </div>
                    `;
                }).join('');
            };

            let configBodyHtml = '';
            if (isInactive) {
                configBodyHtml = `

            } else {
                configBodyHtml = `
                    <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-3">

                        </div>
                    </div>
                    <div class="flex gap-2 mb-6 border-b border-slate-200">
                        <button onclick="window.app.setMenuConfigTab('alimentos')" class="px-4 py-3 font-semibold text-sm transition-all border-b-2 ${state.menuConfigTab === 'alimentos' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'}">🍽️ Alimentos</button>
                        <button onclick="window.app.setMenuConfigTab('bebidas')" class="px-4 py-3 font-semibold text-sm transition-all border-b-2 ${state.menuConfigTab === 'bebidas' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'}">🥤 Bebidas</button>
                    </div>
                    ${state.menuConfigTab === 'alimentos' ? `
                        <div class="animate-in fade-in duration-200">

                                ${renderCategory(filteredBebidas)}
                            </div>
                        </div>

                `;
            }

            return `
                <div class="space-y-6">
                    <button id="floating-menu-save" type="button" onclick="window.app.saveMenu()" aria-label="Guardar menú" title="Guardar menú" class="fixed right-5 bottom-5 z-30 w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white shadow-xl shadow-emerald-900/20 flex items-center justify-center transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-emerald-200">
                        <i data-lucide="save" class="w-6 h-6"></i>
                    </button>
                    <div>
                        <h3 class="font-bold text-lg text-slate-900 mb-2">Diseño del Menú</h3>
                        <p class="text-slate-500 text-sm mb-6">Configurando opciones para la semana: <strong>${getManagingWeek().range}</strong>.</p>
                        <div class="flex flex-wrap gap-2 mb-6">
                            ${daysHtml}
                        </div>
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                            <div class="mb-6 bg-white p-4 rounded-xl border ${isInactive ? 'border-red-300 bg-red-50/50' : 'border-slate-200'} flex items-center justify-between shadow-sm transition-colors">
                                <div>
                                    <h4 class="font-bold ${isInactive ? 'text-red-700' : 'text-slate-700'} flex items-center gap-2">
                                        <i data-lucide="calendar-x" class="w-5 h-5 ${isInactive ? 'text-red-500' : 'text-slate-400'}"></i>
                                        Marcar como Día Inhábil
                                    </h4>
                                    <p class="text-xs ${isInactive ? 'text-red-600/80' : 'text-slate-500'} mt-1">Activa esta opción si no habrá clases este día.</p>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" onchange="window.app.toggleInactiveDay('${state.menuConfigDay}', this.checked)" ${isInactive ? 'checked' : ''} class="sr-only peer">
                                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                                </label>
                            </div>
                            ${configBodyHtml}
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-100 flex justify-end">
                        <button id="bottom-menu-save" onclick="window.app.saveMenu()" class="bg-slate-900 hover:bg-slate-800 text-white px-8 py-3 rounded-xl font-bold transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="save" class="w-5 h-5"></i> Guardar Menú
                        </button>
                    </div>
                </div>

                    <button onclick="window.app.setAdminTab('planificacion')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 whitespace-nowrap ${state.adminTab === 'planificacion' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}"><i data-lucide="calendar-days" class="w-4 h-4"></i> Ciclos y Semanas</button>
                    <button onclick="window.app.setAdminTab('grados')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 whitespace-nowrap ${state.adminTab === 'grados' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}"><i data-lucide="graduation-cap" class="w-4 h-4"></i> Grados</button>
                    <button onclick="window.app.setAdminTab('alumnos')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 whitespace-nowrap ${state.adminTab === 'alumnos' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}"><i data-lucide="users" class="w-4 h-4"></i> Alumnos</button>
                    <button onclick="window.app.setAdminTab('alimentos')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 whitespace-nowrap ${state.adminTab === 'alimentos' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}"><i data-lucide="pizza" class="w-4 h-4"></i> Alimentos y Bebidas</button>
                    <button onclick="window.app.setAdminTab('reporte')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 whitespace-nowrap ${state.adminTab === 'reporte' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}"><i data-lucide="bar-chart-3" class="w-4 h-4"></i> Reporte de Ventas</button>
                    <button onclick="window.app.setAdminTab('pedidos')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 whitespace-nowrap ${state.adminTab === 'pedidos' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200'}"><i data-lucide="list-collapse" class="w-4 h-4"></i> Gestor Pedidos</button>
                </div>
            `;

            if (state.adminTab === 'config') {
                contentHtml = renderAdminTabConfig();

                contentHtml = renderAdminTabPlanificacion();
            } else if (state.adminTab === 'grados') {
                contentHtml = renderAdminTabGrados();
            } else if (state.adminTab === 'alumnos') {
                contentHtml = renderAdminTabAlumnos();
            } else if (state.adminTab === 'alimentos') {
                contentHtml = renderAdminTabAlimentosYBebidas();

                        </h3>
                            <p class="text-slate-500 text-sm mt-1">Gestiona ciclos, catálogos, reportes y accesos. <span class="text-slate-300 text-xs">v5.9</span></p>

                    ${tabButtons}
                    
                    <div class="p-6">
                        ${contentHtml}
                    </div>
                </div>

        // Renderizar Modal Activo
        function renderActiveModal() {
            if (state.editingStudent) return renderEditStudentModal();
            if (state.editingGrade !== null) return renderEditGradeModal();
            if (!state.activeModal) return '';
            
            if (state.activeModal === 'create-cycle') return renderCreateCycleModal();
            if (state.activeModal === 'edit-cycle') return renderEditCycleModal();
            if (state.activeModal === 'create-week') return renderCreateWeekModal();
            if (state.activeModal === 'edit-week') return renderEditWeekModal();
            if (state.activeModal === 'add-students-bulk') return renderAddStudentsModal();
            if (state.activeModal === 'add-student-single') return renderAddSingleStudentModal();
            if (state.activeModal === 'edit-catalog-item') return renderEditCatalogItemModal();
            if (state.activeModal === 'configure-catalog-item') return renderConfigureCatalogItemModal();
            if (state.activeModal === 'confirm-order') return renderConfirmOrderModal();
            
            return '';
        }

            const pending = state.pendingOrderConfirmation;
            if (!pending) return '';
            const order = pending.orderData;
            return `
                <div class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl border border-slate-200">
                        <div class="flex items-start gap-3 mb-6">
                            <div class="w-11 h-11 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center flex-shrink-0"><i data-lucide="clipboard-check" class="w-5 h-5"></i></div>
                            <div><h3 class="text-xl font-bold text-slate-900">Verifica tu pedido</h3><p class="text-sm text-slate-500 mt-1">Revisa la información antes de confirmarlo.</p></div>

                        <div class="bg-slate-50 rounded-2xl border border-slate-200 p-4 space-y-3 mb-6">
                            <div class="flex justify-between gap-3 text-sm"><span class="text-slate-500">Alumno</span><strong class="text-slate-900 text-right">${order.studentName}</strong></div>
                            <div class="flex justify-between gap-3 text-sm"><span class="text-slate-500">Día</span><strong class="text-slate-900">${order.dayFor}</strong></div>
                            <div class="border-t border-slate-200 pt-3 space-y-2">
                                ${order.items.map(line => `<div class="flex justify-between gap-3 text-sm"><span class="text-slate-700">${line.item}${line.variant ? ` - ${line.variant}` : ''}</span><span class="text-slate-500">x${line.quantity}</span></div>`).join('')}
                            </div>
                            <div class="border-t border-slate-200 pt-3 flex justify-between text-base"><span class="font-semibold text-slate-700">Total a pagar</span><strong class="text-emerald-700">${formatCurrency(order.price)}</strong></div>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" onclick="window.app.cancelOrderConfirmation()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-semibold transition-colors">Cancelar</button>
                            <button type="button" onclick="window.app.confirmPendingOrder()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-semibold transition-colors">Confirmar pedido</button>
                        </div>
                    </div>
                </div>

        function renderAdminTabReporte() {
            const reportCycle = state.cycles.find(c => c.id === state.reportCycleId) || getActiveCycle();

            const reportOrders = getReportOrders(reportCycle, reportWeek, state.reportPeriod, state.reportDay);
            const totalOrders = reportOrders.length;
            const totalRevenue = reportOrders.reduce((total, order) => total + getOrderTotal(order, reportWeek), 0);
            const debtOrders = reportOrders.filter(o => o.paymentStatus === 'Fiado');
            const debtAmount = debtOrders.reduce((total, order) => total + getOrderTotal(order, reportWeek), 0);
            const uniqueStudents = new Set(reportOrders.map(o => o.studentName)).size;
            const paymentsCount = reportOrders.reduce((acc, o) => {
                acc[o.paymentStatus] = (acc[o.paymentStatus] || 0) + 1;
                return acc;
            }, {});
            const foodStats = computeFoodStats(reportOrders);
            const orderedFoods = Object.entries(foodStats).sort((a, b) => b[1] - a[1]);
            const mostPopular = orderedFoods.slice(0, 3);
            const leastPopular = orderedFoods.slice(-3).reverse();
            const debtSummary = Object.values(debtOrders.reduce((acc, o) => {
                if (!acc[o.studentName]) acc[o.studentName] = { studentName: o.studentName, amount: 0, firstDate: o.createdAt };
                acc[o.studentName].amount += getOrderTotal(o, reportWeek);
                if (o.createdAt < acc[o.studentName].firstDate) acc[o.studentName].firstDate = o.createdAt;
                return acc;
            }, {}));

            const cycleOptionsHtml = state.cycles.map(c => `<option value="${c.id}" ${c.id === state.reportCycleId ? 'selected' : ''}>${c.name}</option>`).join('');
            const weekOptionsHtml = reportCycle && reportCycle.weeks.length > 0
                ? reportCycle.weeks.map(w => `<option value="${w.id}" ${w.id === state.reportWeekId ? 'selected' : ''}>${w.range}</option>`).join('')

        function normalizeStudentName(name) {
            return (name || '').trim().replace(/\s+/g, ' ').toLowerCase();
        }

        function findDuplicateStudentGrade(studentName, studentCurp) {
            const normalizedName = normalizeStudentName(studentName);
            const normalizedCurp = (studentCurp || '').trim().toUpperCase();

            const grades = Object.keys(state.adminData.students || {});
            for (const grade of grades) {
                const students = state.adminData.students[grade] || [];
                for (const student of students) {
                    const sameName = normalizeStudentName(student.name) === normalizedName;
                    const sameCurp = normalizedCurp && (student.curp || '').trim().toUpperCase() === normalizedCurp;
                    if (sameName || sameCurp) return grade;
                }
            }
            return null;
        }

                const fmt = (d) => { const [y,m,day] = d.split('-'); return `${day}/${m}/${y.slice(2)}`; };
                const fullData = getFullLocalData();
                const cycle = fullData.cycles.find(c => c.id === state.managingCycleId);
                if(!cycle) return;
                const weekNum = cycle.weeks.length + 1;
                const range = `S${weekNum}. DEL ${fmt(startVal)} AL ${fmt(endVal)}`;
                const isFirstWeek = cycle.weeks.length === 0;
                const newWeek = { id: 'week_' + Date.now(), range: range, menu: JSON.parse(JSON.stringify(MENU_POR_DEFECTO)), menuPrices: {}, orders: [], inactiveDays: [], status: isFirstWeek ? 'active' : 'planned' };
                cycle.weeks.push(newWeek);
                if (!cycle.activeWeekId) cycle.activeWeekId = newWeek.id;

            checkHomeOrderSchedule: () => {
                const sched = state.adminData?.settings?.homeOrderSchedule;
                if (!sched || sched.mode === 'always') return { open: true };

                const now = new Date();
                const day = now.getDay();
                if (!sched.days.includes(day)) {
                    const daysMap = {0:'Domingo', 1:'Lunes', 2:'Martes', 3:'Miércoles', 4:'Jueves', 5:'Viernes', 6:'Sábado'};
                    const activeDaysNames = sched.days.map(d => daysMap[d]).join(', ');
                    return { open: false, reason: `Días de servicio permitidos: ${activeDaysNames || 'Ninguno'}.` };
                }

                const currentStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                if (currentStr >= sched.start && currentStr <= sched.end) {
                    return { open: true };
                }
                
                const formatTime = (timeStr) => {
                    if(!timeStr) return '';
                    let [h, m] = timeStr.split(':'); 
                    h = parseInt(h); 
                    const ampm = h >= 12 ? 'p.m.' : 'a.m.'; 
                    h = h % 12 || 12; 
                    return `${h}:${m} ${ampm}`;
                };

                return { open: false, reason: `El horario de atención para pedidos es de ${formatTime(sched.start)} a ${formatTime(sched.end)}.` };
            },

            handlePasswordKeydown: (event, input) => {
                if (event.ctrlKey || event.metaKey || event.altKey) return;
                const current = input.dataset.rawPassword ?? '';
                if (event.key === 'Backspace') {
                    event.preventDefault();
                    input.dataset.rawPassword = current.slice(0, -1);
                    renderMaskedPassword(input);
                    return;
                }
                if (event.key === 'Delete') {
                    event.preventDefault();
                    input.dataset.rawPassword = '';
                    renderMaskedPassword(input);
                    return;
                }
                if (event.key.length !== 1) return;
                event.preventDefault();
                const nextCharacter = input.hasAttribute('data-uppercase-password') ? event.key.toUpperCase() : event.key;
                const nextPassword = current + nextCharacter;
                input.dataset.rawPassword = input.maxLength > 0 ? nextPassword.slice(0, input.maxLength) : nextPassword;
                renderMaskedPassword(input, true);
                clearTimeout(input.passwordRevealTimer);
                input.passwordRevealTimer = setTimeout(() => renderMaskedPassword(input), 900);
            },

            handlePasswordPaste: (event, input) => {
                event.preventDefault();
                const pasted = event.clipboardData?.getData('text') || '';
                if (!pasted) return;
                const normalizedPaste = input.hasAttribute('data-uppercase-password') ? pasted.toUpperCase() : pasted;
                const nextPassword = (input.dataset.rawPassword || '') + normalizedPaste;
                input.dataset.rawPassword = input.maxLength > 0 ? nextPassword.slice(0, input.maxLength) : nextPassword;
                renderMaskedPassword(input, true);
                clearTimeout(input.passwordRevealTimer);
                input.passwordRevealTimer = setTimeout(() => renderMaskedPassword(input), 900);
            },

            showToast: (message, type = 'success', duration = 4000) => {
                const container = document.getElementById('toast-container');
                if (!container) return;
                
                const toastId = 'toast_' + Date.now();
                const palette = {
                    success: { bg: 'bg-gradient-to-r from-emerald-500 to-green-500', ring: 'ring-emerald-100', icon: 'check-circle-2' },
                    error: { bg: 'bg-gradient-to-r from-red-500 to-rose-500', ring: 'ring-red-100', icon: 'alert-circle' },
                    info: { bg: 'bg-gradient-to-r from-blue-500 to-indigo-500', ring: 'ring-blue-100', icon: 'info' }
                };
                const selected = palette[type] || palette.info;
                
                const toast = document.createElement('div');
                toast.id = toastId;
                toast.className = `toast ${selected.bg} text-white px-4 py-3 rounded-2xl shadow-xl ring-2 ${selected.ring} flex items-center gap-3 max-w-sm border border-white/20 backdrop-blur-sm`;
                toast.innerHTML = `
                    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-white/15">
                        <i data-lucide="${selected.icon}" class="w-4 h-4 flex-shrink-0"></i>
                    </div>
                    <span class="text-sm font-semibold flex-grow leading-snug">${message}</span>
                `;
                
                container.appendChild(toast);
                if (window.lucide) window.lucide.createIcons();
                
                setTimeout(() => {
                    toast.classList.add('out');
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            },

            setSearchQuery: (field, query) => {
                state[field] = query.toLowerCase();

            filterStudents: (query) => {
                const grade = state.formSelection.grade;
                if (!grade) return;
                
                const allStudents = state.adminData.students[grade] || [];
                const filteredStudents = allStudents.filter(s => s.name.toLowerCase().includes((query||'').toLowerCase()));
                const dropdown = document.getElementById('student-dropdown');
                
                if (!dropdown) return;
                
                if (query.trim() === '' || filteredStudents.length === 0) {
                    dropdown.classList.add('hidden');
                    return;
                }
                
                let html = '';
                filteredStudents.forEach(student => {
                    html += `<div class="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-slate-100 transition-colors" onclick="window.app.selectStudent('${student.name}')"><span class="font-medium text-slate-700">${student.name}</span></div>`;
                });
                
                dropdown.innerHTML = html;
                dropdown.classList.remove('hidden');
            },

            toggleStudentDropdown: () => {
                const grade = state.formSelection.grade;
                if (!grade) return alert('Selecciona primero un grado.');
                const allStudents = state.adminData.students[grade] || [];
                const dropdown = document.getElementById('student-dropdown');
                if (!dropdown) return;
                if (dropdown.classList.contains('hidden')) {
                    if (allStudents.length === 0) {
                        dropdown.innerHTML = `<div class="p-4 text-sm text-slate-500">No hay alumnos en este grado.</div>`;
                    } else {
                        dropdown.innerHTML = allStudents.map(s => `<div class="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-slate-100 transition-colors" onclick="window.app.selectStudent('${s.name}')"><span class="font-medium text-slate-700">${s.name}</span></div>`).join('');

                    dropdown.classList.add('hidden');
                }

            loginCasa: (e) => {
                e.preventDefault();
                const casaPasswordInput = document.getElementById('casa-login-pwd');
                const pwd = getPasswordInputValue(casaPasswordInput).trim().toUpperCase().slice(0, 10);
                casaPasswordInput.dataset.rawPassword = pwd;
                renderMaskedPassword(casaPasswordInput);
                let foundStudent = null;
                let foundGrade = null;
                
                for (let grade in state.adminData.students) {
                    const stu = state.adminData.students[grade].find(s => s.password === pwd && pwd !== '');
                    if (stu) {
                        foundStudent = stu;
                        foundGrade = grade;
                        break;
                    }
                }

                if (foundStudent) {
                    if (foundStudent.isBlocked) {
                        alert('🚫 Tu acceso para pedidos desde casa está suspendido temporalmente. Los pedidos ahora solo se pueden realizar directamente en la escuela.');
                        return;
                    }
                    state.loggedStudent = { ...foundStudent, grade: foundGrade };
                    state.formSelection.grade = foundGrade;
                    renderView();
                } else {
                    alert('Clave incorrecta o alumno no encontrado. Verifica los 10 dígitos o pide al maestro que actualice la contraseña.');
                }
            },

                state.loggedStudent = null;
                renderView();

            saveCurrentMenuTemplate: () => {
                const name = prompt('Nombre para la plantilla de menú:');
                if (!name || !name.trim()) return;
                const templateName = name.trim();
                const exists = state.adminData.menuTemplates.find(t => t.name.toLowerCase() === templateName.toLowerCase());
                if (exists && !confirm('Ya existe una plantilla con este nombre. ¿Deseas reemplazarla?')) return;

                const newTemplate = {
                    id: 'tmpl_' + Date.now(),
                    name: templateName,
                    menu: JSON.parse(JSON.stringify(state.draftMenu)),
                    menuPrices: JSON.parse(JSON.stringify(state.draftMenuPrices))
                };

                if (exists) {
                    state.adminData.menuTemplates = state.adminData.menuTemplates.map(t => t.id === exists.id ? newTemplate : t);
                } else {
                    state.adminData.menuTemplates.push(newTemplate);
                }

                const fullData = getFullLocalData();
                fullData.adminData = state.adminData;
                saveFullLocalData(fullData); loadLocalData(); renderView();
                window.app.showToast('Plantilla guardada correctamente', 'success');
            },
            applyMenuTemplate: (templateId) => {
                const template = state.adminData.menuTemplates.find(t => t.id === templateId);
                if (!template) return;
                state.draftMenu = JSON.parse(JSON.stringify(template.menu));
                state.draftMenuPrices = JSON.parse(JSON.stringify(template.menuPrices || {}));
                renderView();
                window.app.showToast(`Plantilla ${template.name} aplicada`, 'success');
            },

                if(!confirm("¿Estás seguro de eliminar esta semana y TODOS sus pedidos?")) return;
                const fullData = getFullLocalData();
                const targetCycle = fullData.cycles.find(c => c.id === state.managingCycleId);

            createNewWeek: () => {

            makeWeekActive: (weekId) => {
                if(!confirm("¿Deseas activar esta semana? Publicará este menú a los padres y reiniciará el monitor de la cocina.")) return;
                const fullData = getFullLocalData();
                const cycle = fullData.cycles.find(c => c.id === state.managingCycleId);
                
                if (fullData.activeCycleId !== cycle.id) {
                    if(!confirm("Este ciclo no es el activo actualmente. ¿Deseas hacer que todo el ciclo se vuelva activo también?")) return;
                    fullData.activeCycleId = cycle.id;
                }

                const currentActive = cycle.weeks.find(w => w.id === cycle.activeWeekId);
                if (currentActive) {
                    currentActive.status = 'archived';
                    currentActive.summaryData = { total: currentActive.orders.length, delivered: currentActive.orders.filter(o=>o.status==='entregado').length, pending: currentActive.orders.filter(o=>o.status==='pendiente').length };
                }
                const targetWeek = cycle.weeks.find(w => w.id === weekId);
                if (targetWeek) { targetWeek.status = 'active'; cycle.activeWeekId = weekId; }
                saveFullLocalData(fullData); loadLocalData(); renderView();
            },

            toggleInactiveDay: (day, isInactive) => {
                if (isInactive) {
                    if (!state.draftInactiveDays.includes(day)) state.draftInactiveDays.push(day);
                } else {
                    state.draftInactiveDays = state.draftInactiveDays.filter(d => d !== day);
                }
                renderView();
            },

            toggleFood: (food) => {
                const dayFoods = state.draftMenu[state.menuConfigDay] || [];
                if (dayFoods.includes(food)) state.draftMenu[state.menuConfigDay] = dayFoods.filter(f => f !== food);
                else state.draftMenu[state.menuConfigDay].push(food);
                renderView();
            },

                                            </div>
                                        </div>`;

                            summaryHtml += `</div></div>`;
                            summaryContainer.innerHTML = summaryHtml;
                            summaryContainer.classList.remove('hidden');
                            if(submitBtn) submitBtn.style.display = 'none';
                        } else {
                            summaryContainer.innerHTML = '';

                        if (window.lucide) lucide.createIcons();
                    }
                    return; 
                }

                const studentSelect = document.getElementById('form-student');

                    const availableStudents = allStudents.filter(s => !orderedStudentNames.includes(s.name));

                        studentSelect.disabled = false;

                    studentSelect.innerHTML = optionsHtml;

                    if (summaryContainer) {

            editOrder: (orderId, source) => {
                const fullData = getFullLocalData();
                const cycleId = source === 'Escuela' ? state.managingCycleId : (source === 'Admin' ? state.reportCycleId : state.activeCycleId);
                const weekId = source === 'Escuela' ? state.managingWeekId : (source === 'Admin' ? state.reportWeekId : getActiveWeek()?.id); 
                const cycle = fullData.cycles.find(c => c.id === cycleId);
                const week = cycle?.weeks.find(w => w.id === weekId);
                
                if (week) {
                    const orderIndex = week.orders.findIndex(o => o.id === orderId);
                    if(orderIndex > -1) {
                        const o = week.orders[orderIndex];
                        
                        state.formSelection.day = o.dayFor;
                        state.formSelection.grade = o.grade;
                        state.formSelection.payment = o.paymentStatus || 'Pagado';
                        
                        week.orders.splice(orderIndex, 1);
                        saveFullLocalData(fullData);
                        loadLocalData();

                        if (source === 'Admin') {
                            state.view = 'escuela';
                            state.schoolTab = 'pedidos';
                            state.managingCycleId = cycleId;
                            state.managingWeekId = weekId;
                        }

                        renderView(); 
                        alert(`El pedido de ${o.studentName} ha sido devuelto al formulario de Escuela para su edición.`);
                        
                        setTimeout(() => {
                            const studentSelect = document.getElementById('form-student');
                            if(studentSelect) studentSelect.value = o.studentName;
                            
                            const fRadios = document.getElementsByName('foodSelection');
                            for(let r of fRadios) { if(o.breakfastType.includes(r.value)) { r.checked = true; window.app.selectFood(r); } }
                            const dRadios = document.getElementsByName('drinkSelection');
                            for(let r of dRadios) { if(o.breakfastType.includes(r.value)) { r.checked = true; window.app.selectFood(r); } }
                        }, 100);
                    }
                }
            },

            deleteOrder: (orderId, source) => {
                if(!confirm("¿Estás seguro de que deseas eliminar este pedido por completo?")) return;
                const fullData = getFullLocalData();
                const cycleId = source === 'Escuela' ? state.managingCycleId : (source === 'Admin' ? state.reportCycleId : state.activeCycleId);
                const weekId = source === 'Escuela' ? state.managingWeekId : (source === 'Admin' ? state.reportWeekId : getActiveWeek()?.id); 
                const cycle = fullData.cycles.find(c => c.id === cycleId);
                const week = cycle?.weeks.find(w => w.id === weekId);

                if (week) {
                    week.orders = week.orders.filter(o => o.id !== orderId);
                    saveFullLocalData(fullData); loadLocalData(); renderView();
                }
            },

                    el.parentElement.classList.add('border-slate-200');

            updateVariantQuantity: (quantityInput, source) => {
                const card = quantityInput.closest('label.food-label');
                const productCheckbox = card?.querySelector('input[name="foodSelection"], input[name="drinkSelection"]');
                const hasQuantity = Array.from(card?.querySelectorAll('.order-variant-quantity') || []).some(input => Number(input.value) > 0);
                if (productCheckbox) {
                    productCheckbox.checked = hasQuantity;
                    productCheckbox.dataset.foodSelected = hasQuantity ? 'true' : 'false';
                    productCheckbox.parentElement.classList.toggle('border-blue-500', hasQuantity);
                    productCheckbox.parentElement.classList.toggle('bg-blue-50', hasQuantity);
                    productCheckbox.parentElement.classList.toggle('border-slate-200', !hasQuantity);
                }
                refreshSelectedOrderTotal(source);

            submitOrder: (e, source) => {
                e.preventDefault();

                const dayFor = document.getElementById('form-day').value;
                const grade = source === 'Casa' ? state.loggedStudent.grade : state.formSelection.grade;
                const studentName = source === 'Casa' ? state.loggedStudent.name : document.getElementById('form-student').value;
                
                const paymentStatus = source === 'Casa' ? 'Casa' : (state.formSelection.payment || 'Pagado');
                
                const fullData = getFullLocalData();
                const targetCycleId = source === 'Escuela' ? state.managingCycleId : state.activeCycleId;
                const targetWeekId = source === 'Escuela' ? state.managingWeekId : getActiveWeek()?.id; 
                const targetCycle = fullData.cycles.find(c => c.id === targetCycleId);
                const targetWeek = targetCycle?.weeks.find(w => w.id === targetWeekId);

                if (targetWeek && targetWeek.inactiveDays && targetWeek.inactiveDays.includes(dayFor)) {
                    window.app.showToast("No se pueden realizar pedidos en un día inhábil.", "error");
                    return;
                }
                
                const selectedLines = getSelectedOrderLines(targetWeek);
                const selectedInputs = Array.from(document.querySelectorAll('input[name="foodSelection"]:checked, input[name="drinkSelection"]:checked'));
                if (!grade || !studentName || selectedLines.length === 0) {
                    window.app.showToast("Completa los datos y selecciona al menos un alimento o bebida.", "error");
                    return;
                }

                // Validación de duplicados: verificar si el alumno ya tiene pedido para este día
                const existingOrder = targetWeek?.orders?.find(o => 
                    o.studentName === studentName && 
                    o.dayFor === dayFor && 
                    o.status === 'pendiente'
                );
                
                if (existingOrder) {
                    window.app.showToast(`${studentName} ya tiene un pedido pendiente para el ${dayFor}.`, "error");
                    return;
                }

                const breakfastType = selectedLines.map(line => `${line.item}${line.variant ? ` - ${line.variant}` : ''}${line.quantity > 1 ? ` x${line.quantity}` : ''}`).join(' + ');
                const orderPrice = getOrderLinesTotal(selectedLines, targetWeek?.menuPrices);
                const now = new Date();
                const orderData = {
                    id: 'ord_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    orderNumber: getNextOrderNumber(targetWeek),
                    source, dayFor, grade, studentName,
                    items: selectedLines,
                    breakfastType: breakfastType, paymentStatus: paymentStatus, 
                    price: orderPrice,
                    status: 'pendiente', 
                    timestamp: Date.now(),
                    createdAt: now.toISOString(),
                    history: [{ status: 'pendiente', date: now.toISOString(), note: 'Pedido creado' }]
                };

                if (targetWeek) {
                    state.pendingOrderConfirmation = { fullData, cycleId: targetCycleId, weekId: targetWeekId, orderData };
                    state.activeModal = 'confirm-order';
                    renderView();
                } else {
                    window.app.showToast("Error: No se pudo localizar la semana activa.", "error");
                }
            },

            completeOrder: (orderId) => {
                const fullData = getFullLocalData();
                const cycle = fullData.cycles.find(c => c.id === fullData.activeCycleId);
                const activeWeek = cycle?.weeks.find(w => w.id === cycle.activeWeekId);
                if (activeWeek) {
                    const orderIndex = activeWeek.orders.findIndex(o => o.id === orderId);
                    if (orderIndex > -1) {
                        activeWeek.orders[orderIndex].status = 'entregado';
                        activeWeek.orders[orderIndex].completedAt = Date.now();
                        saveFullLocalData(fullData); loadLocalData(); renderView();
                    }
                }
            },

                const activeWeek = cycle?.weeks.find(w => w.id === cycle.activeWeekId);
                if (activeWeek) {
                    const orderIndex = activeWeek.orders.findIndex(o => o.id === orderId);
                    if (orderIndex > -1) {
                        activeWeek.orders[orderIndex].status = 'pendiente';
                        activeWeek.orders[orderIndex].completedAt = null;

                const activeWeek = cycle?.weeks.find(w => w.id === cycle.activeWeekId);
                if (activeWeek) {
                    activeWeek.orders = activeWeek.orders.filter(o => o.id !== orderId);
